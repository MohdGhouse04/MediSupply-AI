services:

  kafka:
    image: apache/kafka:4.1.1
    container_name: medisupply-kafka
    hostname: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data/kafka-logs

    volumes:
      - medisupply-kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medisupply-api
    restart: unless-stopped
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://mohdghouse@host.docker.internal:5432/medisupply
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medisupply-outbox-worker
    restart: unless-stopped
    command: python -m backend.app.services.outbox_worker

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://mohdghouse@host.docker.internal:5432/medisupply
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

  purchase-order-consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medisupply-purchase-order-consumer
    restart: unless-stopped
    command: python -m backend.app.services.purchase_order_consumer

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://mohdghouse@host.docker.internal:5432/medisupply
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

volumes:
  medisupply-kafka-data:
    external: true
